appId: rw.co.optimaclays.desktop
productName: Optima Clays
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: logo.png
    to: logo.png
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
